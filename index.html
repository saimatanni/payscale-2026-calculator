:root{
  --paper:#F2F6F3; --sheet:#FFFFFF; --ink:#14211B; --muted:#55665E; --line:#C9D6CE;
  --green:#0E5A43; --green-ink:#FFFFFF; --green-soft:#DCEBE3; --green-mid:#7DB59E;
  --red:#B3261E; --red-soft:#F8E3E0; --bar:#D5E0D9; --focus:#B3261E;
  --field:#F4F8F5; --field-line:#8AA396; --head:#E3EFE8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D1512; --sheet:#14201B; --ink:#E7EFEA; --muted:#9DB0A6; --line:#2B3B33;
    --green:#1B7358; --green-ink:#F3FBF7; --green-soft:#1B3128; --green-mid:#3F8C72;
    --red:#F07A6E; --red-soft:#3A1F1C; --bar:#2A3A32; --focus:#F07A6E;
    --field:#0A110E; --field-line:#56715F; --head:#1D362C;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1512; --sheet:#14201B; --ink:#E7EFEA; --muted:#9DB0A6; --line:#2B3B33;
  --green:#1B7358; --green-ink:#F3FBF7; --green-soft:#1B3128; --green-mid:#3F8C72;
  --red:#F07A6E; --red-soft:#3A1F1C; --bar:#2A3A32; --focus:#F07A6E;
    --field:#0A110E; --field-line:#56715F; --head:#1D362C;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Hind Siliguri","Noto Sans Bengali","Segoe UI",system-ui,sans-serif;
  font-size:16px;line-height:1.55;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:"Tiro Bangla","Noto Serif Bengali",Georgia,serif;font-weight:400;margin:0;line-height:1.25}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.mast{background:var(--green);color:var(--green-ink)}
.mast-in{max-width:1180px;margin:0 auto;padding:28px 20px 30px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
.mast h1{font-size:clamp(1.7rem,4.2vw,2.75rem);letter-spacing:-0.01em}
.mast p{margin-top:10px;max-width:68ch;opacity:.92;font-size:.98rem}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.55);border-radius:4px;overflow:hidden}
.lang button{background:transparent;border:0;color:var(--green-ink);padding:7px 13px;cursor:pointer;font-size:.95rem;min-height:38px}
.lang button[aria-pressed="true"]{background:var(--green-ink);color:var(--green)}
.themebtn{display:inline-grid;place-items:center;width:40px;height:40px;padding:0;background:transparent;color:var(--green-ink);border:1px solid rgba(255,255,255,.55);border-radius:4px;cursor:pointer}
.themebtn:hover{background:rgba(255,255,255,.14)}
.themebtn .i-sun{display:none}
.themebtn.is-dark .i-sun{display:block}
.themebtn.is-dark .i-moon{display:none}
@media (max-width:640px){.mast-in{grid-template-columns:minmax(0,1fr)}.tools{justify-content:flex-start;order:-1}}

.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 56px;display:grid;grid-template-columns:minmax(0,390px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}}

.form{background:var(--sheet);border:1px solid var(--line);border-top:4px solid var(--green);border-radius:4px;padding:6px 20px 22px}
.form h2{font-size:1.2rem;margin:20px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.field{margin-bottom:14px}
.field label,.field .lab{display:block;font-weight:500;margin-bottom:4px}
.hint{display:block;color:var(--muted);font-size:.86rem;line-height:1.4;margin-top:4px}
select,input[type=number]{width:100%;padding:10px 11px;background:var(--paper);border:1px solid var(--line);border-radius:4px;min-height:44px}
.check{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;margin-bottom:10px}
.check input[type=checkbox]{width:20px;height:20px;margin:3px 0 0;accent-color:var(--green)}
.bfrow{align-items:end}
.check label{font-weight:400;margin:0}
.gpfrow{display:grid;grid-template-columns:1fr 84px auto;gap:10px;align-items:center}
.gpfrow input[type=range]{accent-color:var(--green);min-height:44px}
tr.ded td{color:var(--red)}
.period .kv .ded{color:var(--red)}
.bfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.bfrow label{font-size:.86rem;font-weight:500;display:block;margin-bottom:4px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.three label{font-size:.88rem;font-weight:500}
@media (max-width:420px){.three{grid-template-columns:1fr}}
details{border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
summary{cursor:pointer;font-weight:500;padding:4px 0}
details>div{padding-top:10px}
.linkbtn{background:none;border:0;padding:0;color:var(--green);text-decoration:underline;cursor:pointer;font-size:.88rem}
:root[data-theme="dark"] .linkbtn{color:var(--green-mid)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .linkbtn{color:var(--green-mid)}}

.out{display:grid;gap:24px;min-width:0}
.block{min-width:0;background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:20px}
.block h2{font-size:1.35rem;margin-bottom:12px}
.work{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.work li{padding-left:16px;border-left:3px solid var(--green-soft)}
.work b{font-weight:600}
.result{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.result div{padding:12px 14px;border-right:1px solid var(--line)}
.result div:last-child{border-right:0}
.result .big{display:block;font-family:"Tiro Bangla",Georgia,serif;font-size:1.9rem;line-height:1.15}
.result .hl{background:var(--green-soft)}
.result span.s{color:var(--muted);font-size:.88rem}

.stairs{display:flex;align-items:flex-end;gap:3px;height:150px;margin-top:6px;border-bottom:2px solid var(--ink)}
.stairs i{flex:1;min-width:0;background:var(--bar);display:block;border-radius:2px 2px 0 0}
.stairs i.fix{background:var(--green-mid)}
.stairs i.now{background:var(--green)}
.stairs i.next{background:var(--red)}
.legend{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:4px;font-size:.93rem}
.legend li{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center}
.legend em{width:14px;height:14px;border-radius:2px;display:block}
.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-top:4px}

.ledger-scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:.95rem}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:0;width:22%;position:sticky;left:0;background:var(--sheet)}
thead th{vertical-align:bottom;font-weight:600;white-space:normal;min-width:98px;border-bottom:2px solid var(--ink)}
thead small{display:block;font-weight:400;color:var(--muted);font-size:.8rem;line-height:1.3}
tr.total td{font-weight:600;border-top:2px solid var(--ink);font-size:1.05rem}
tr.delta td{color:var(--green);border-bottom:0}
:root[data-theme="dark"] tr.delta td{color:var(--green-mid)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) tr.delta td{color:var(--green-mid)}}
td.neg{color:var(--red)!important}
col.final{background:var(--green-soft)}
.periods{display:none}
.period{border:1px solid var(--line);border-radius:4px;margin-bottom:12px;overflow:hidden}
.period h3{font-family:inherit;font-weight:600;font-size:1rem;padding:9px 12px;background:var(--green-soft);display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.period h3 small{font-weight:400;color:var(--muted);font-size:.8rem;text-align:right}
.period .kv{margin:0;padding:6px 12px 10px}
.period .kv .tot{border-top:2px solid var(--ink);border-bottom:0;font-weight:600;padding-top:6px;margin-top:2px}
.period .kv .dl{border-bottom:0;color:var(--green)}
:root[data-theme="dark"] .period .kv .dl{color:var(--green-mid)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .period .kv .dl{color:var(--green-mid)}}
@media (max-width:640px){.ledger-scroll{display:none}.periods{display:block}}
.items{margin:14px 0 0;padding:0;list-style:none;columns:2;column-gap:28px;font-size:.93rem}
.items li{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px dotted var(--line);break-inside:avoid}
@media (max-width:560px){.items{columns:1}}
.pdfbar{display:flex;justify-content:center}
.pdfbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 26px;background:var(--green);color:#fff;border:0;border-radius:6px;cursor:pointer;font-size:1.05rem;font-weight:500;box-shadow:0 1px 3px rgba(14,90,67,.25)}
.pdfbtn:hover{filter:brightness(1.08)}
.pdfbtn[disabled]{opacity:.7;cursor:wait}

.printsum{display:none}
.scalechart{display:none}

.scalegrid span{color:var(--muted);text-transform:capitalize}
.scalegrid .fix{background:var(--green-soft)}

function newHRpct(grade,loc){                /* clause 15(6) */

  var row = g>=16 ? [60,50,45] : g>=10 ? [50,40,35] : g>=5 ? [45,35,30] : [40,30,25];
  return row[loc];
}
function oldHR(basic,loc){                   /* 2015 order, estimate only */
  var b = basic<=9700 ? [[65,55,50],[5600,5000,4500]] :
          basic<=16000 ? [[60,50,45],[6400,5400,4800]] :
          basic<=35500 ? [[55,45,40],[9600,8000,7000]] :
                         [[50,40,35],[19500,16000,13800]];
  return Math.max(Math.round(basic*b[0][loc]/100), b[1][loc]);
}
function spAmount(basic,pct){ return pct ? Math.max(Math.round(basic*pct/100), pct===15?1500:1000) : 0; }
function compute(s){
  s.special=spAmount(s.oldBasic,s.spPct); s.specialPaid=spAmount(s.paidBasic,s.spPct);
  var fixed=FIXED[s.grade], r={fixedPost:!!fixed};
  if(fixed){
    r.N=fixed[0]; r.N27=fixed[0]; r.fix=fixed[0];
  }else{
    var f=fixPay(s.grade,s.oldBasic), n=NEW[s.grade], last=n.length-1;
    r.f=f; r.fix=n[f.idx];
    r.idxN = s.inc ? Math.min(f.idx+1,last) : f.idx;
    r.idx27 = Math.min(r.idxN+1,last);
    r.N=n[r.idxN]; r.N27=n[r.idx27];
  }
  r.D=r.N-s.oldBasic;
  var p=phasePct(s.grade); r.p=p;
  /* Only the fixation gap is staged. The 1 July 2026 increment is added in
     full on top, once, and is not added again in the second stage. */
  r.gap=r.fix-s.oldBasic; r.inc=r.N-r.fix;
  r.b1=s.oldBasic+p[0]*r.gap+r.inc; r.b2=s.oldBasic+p[1]*r.gap+r.inc;
  var g=parseInt(s.grade,10); if(isNaN(g)) g=1;
  var low = g>=11;
  var items=[];
  var hr = s.quarter ? 0 : Math.round(r.N27*newHRpct(s.grade,s.loc)/100);
  var med = s.age===1 ? 4000 : 3000;
  if(s.kids) items.push(["i_edu",500*s.kids]);
  if(low && s.tiffin) items.push(["i_tiffin",500]);
  if(low && s.conv) items.push(["i_conv",600]);
  if(s.mobile) items.push(["i_mobile", g<=5 ? 500 : 150]);
  if(s.wash) items.push(["i_wash",300]);
  if(s.charge) items.push(["i_charge",1500]);
  if(s.hill) items.push(["i_hill",Math.min(Math.round(r.N27*0.2), s.hill===1?5000:5500)]);
  if(s.haor) items.push(["i_haor",Math.min(Math.round(r.N27*0.2),5000)]);
  if(g<=9 && s.train) items.push(["i_train",Math.round(r.N27*0.1)]);
  if(s.dis) items.push(["i_dis",3000*s.dis]);
  if(s.ent) items.push(["i_ent",s.ent]);
  var oth=0; items.forEach(function(x){oth+=x[1];});
  r.newHR=hr; r.newMed=med; r.newOth=oth; r.items=items;
  r.hrPct = s.quarter?0:newHRpct(s.grade,s.loc);
  var oldAll=s.oHR+s.oMed+s.oOth;
  r.cols=[
    {basic:s.oldBasic,hr:s.oHR,med:s.oMed,oth:s.oOth,sp:s.special},
    {basic:r.b1,hr:s.oHR,med:s.oMed,oth:s.oOth,sp:0},
    {basic:r.b2,hr:s.oHR,med:s.oMed,oth:s.oOth,sp:0},
    {basic:r.N27,hr:s.oHR,med:s.oMed,oth:s.oOth,sp:0},
    {basic:r.N27,hr:hr,med:med,oth:oth,sp:0}
  ];
  r.cols.forEach(function(c){c.total=c.basic+c.hr+c.med+c.oth+c.sp; c.gpf=Math.round(c.basic*s.gpf/100); c.bf = s.bf ? Math.min(Math.round(c.basic*s.bfRate/100), s.bfCap>0?s.bfCap:Infinity) : 0; c.stamp = s.stamp?10:0; c.loan=s.loan; c.home = s.homeLoan ? c.hr : 0; c.tax=s.tax; c.ded=c.gpf+c.bf+c.stamp+c.loan+c.home+c.tax; c.net=c.total-c.ded;});
  r.cols.forEach(function(c){c.delta=c.net-r.cols[0].net;});
  function bfOf(b){ return s.bf ? Math.min(Math.round(b*s.bfRate/100), s.bfCap>0?s.bfCap:Infinity) : 0; }
  r.arrExtra = r.b1 - s.paidBasic;
  /* House rent is frozen at the 30 June 2026 amount until 31 December 2027, but in
     July to September the office paid it on the old scale basic after the 1 July
     increment. Under the 2015 slabs that usually lands high, so the extra has to
     come back out of the arrears. At a slab boundary the rate drops 5 points and
     the floor does not always cover it, so house rent fell and a little more is
     owed instead. One signed term covers both directions, for every grade. */
  r.arrHRjun  = s.quarter ? 0 : oldHR(s.oldBasic, s.loc);
  r.arrHRpaid = s.quarter ? 0 : oldHR(s.paidBasic, s.loc);
  r.arrHR     = r.arrHRjun - r.arrHRpaid;
  r.arrGpf = s.arrDed ? Math.round(r.arrExtra*s.gpf/100) : 0;
  r.arrBf  = s.arrDed ? bfOf(r.b1)-bfOf(s.paidBasic) : 0;
  r.arrearMonth = r.arrExtra - s.specialPaid + r.arrHR - r.arrGpf - r.arrBf;
  return r;
}
function oldOtherEstimate(s){
  var g=parseInt(s.grade,10); if(isNaN(g)) g=1;
  var t=500*s.kids;
  if(g>=11 && s.tiffin) t+=200;
  if(g>=11 && s.conv) t+=300;
  if(s.wash) t+=100;
  return t;
}

function readState(){
  var g=$("grade").value, fixed=!!FIXED[g];
  return {
    grade:g,
    oldBasic: fixed ? (parseFloat($("basicFixed").value)||0) : parseInt($("basic").value,10),
    paidBasic:(function(){ if(fixed) return parseFloat($("basicFixed").value)||0; var o=OLD[g], i=o.indexOf(parseInt($("basic").value,10)); return o[Math.min(i+1,o.length-1)]; })(), arrDed:$("arrDed").checked,
    tax:Math.max(0,parseFloat($("tax").value)||0),
    homeLoan:$("homeLoan").checked,
    loan:Math.max(0,parseFloat($("loan").value)||0),
    bf:$("bf").checked, bfRate:Math.max(0,parseFloat($("bfRate").value)||0), bfCap:Math.max(0,parseFloat($("bfCap").value)||0), stamp:$("stamp").checked,
    gpf:Math.min(25,Math.max(0,parseFloat($("gpf").value)||0)),
    inc:$("inc").checked, spPct:parseInt($("special").value,10)||0,
    loc:parseInt($("loc").value,10), quarter:$("quarter").checked,
    age:parseInt($("age").value,10), kids:parseInt($("kids").value,10),
    tiffin:$("tiffin").checked, conv:$("conv").checked, mobile:$("mobile").checked, wash:$("wash").checked,
    charge:$("charge").checked, hill:parseInt($("hill").value,10), haor:$("haor").checked, train:$("train").checked,
    dis:parseInt($("dis").value,10), ent:parseInt($("ent").value,10),
    oHR:parseFloat($("oHR").value)||0, oMed:parseFloat($("oMed").value)||0, oOth:parseFloat($("oOth").value)||0
  };
}
function fillOldEstimates(){
  if(autoSp){ var gg=parseInt($("grade").value,10); $("special").value = (!isNaN(gg)&&gg>=10) ? "15" : "10"; }
  var s=readState();
  if(autoOld.oHR) $("oHR").value = s.quarter?0:oldHR(s.oldBasic,s.loc);
  if(autoOld.oMed) $("oMed").value = 1500;
  if(autoOld.oOth) $("oOth").value = oldOtherEstimate(s);
}
function applyText(){
  document.documentElement.lang=lang;
  document.title=T("title");
  Array.prototype.forEach.call(document.querySelectorAll("[data-t]"),function(el){ el.textContent=T(el.getAttribute("data-t")); });
  Array.prototype.forEach.call(document.querySelectorAll(".lang button"),function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-lang")===lang?"true":"false"); });
  $("notes").innerHTML=NOTES[lang].map(function(n){return "<li>"+esc(n)+"</li>";}).join("");
}

function render(){
  var g=$("grade").value, gi=parseInt(g,10), low=!isNaN(gi)&&gi>=11;
  $("tiffinRow").hidden=!low; $("convRow").hidden=!low;
  $("trainRow").hidden=!(isNaN(gi)||gi<=9);
  fillOldEstimates();
  var s=readState(), r=compute(s), L=lang==="bn";
  function optText(id){ var e=$(id); return e.options[e.selectedIndex] ? e.options[e.selectedIndex].text : ""; }
  $("printSum").innerHTML='<span>'+esc(T("l_grade"))+': <b>'+esc(optText("grade"))+'</b></span>'+
    '<span>'+esc(T("l_basic"))+': <b>'+tk(s.oldBasic)+'</b></span>'+
    '<span>'+esc(T("l_loc"))+': <b>'+esc(optText("loc"))+'</b></span>';
  /* PDF only: the new scale for the grade being calculated, with the
     fixed step, the step after the 2026 increment and the 2027 step marked. */
  var sc='<h2>'+esc(T("h_scale"))+': '+esc(optText("grade"))+'</h2><div class="scalegrid">';
  if(r.fixedPost) sc+='<div class="now"><span>'+esc(T("lg_fix"))+'</span><b>'+tk(r.N)+'</b></div>';
  else NEW[g].forEach(function(v,i){
    var c = i===r.idxN ? "now" : (i===r.idx27 && r.idx27!==r.idxN) ? "next" : (i===r.f.idx) ? "fix" : "";
    sc+='<div class="'+c+'"><span>'+esc(T("step"))+' '+num(i+1)+'</span><b>'+tk(v)+'</b></div>';
  });
  $("scaleChart").innerHTML=sc+'</div>';

  /* working */
  var w=[];
  if(r.fixedPost){
    w.push(L ? "এই পদের বেতন নির্ধারিত, <b>"+tk(r.N)+"</b>। ধাপভিত্তিক বেতন নির্ধারণ এখানে প্রযোজ্য নয় (অনুচ্ছেদ ৫(গ))।"
             : "This post has a fixed pay of <b>"+tk(r.N)+"</b>. Step by step fixation does not apply (clause 5(ga)).");
  }else{
    var o0=OLD[g][0], n0=NEW[g][0];
    if(r.f.diff===0){
      w.push(L ? "আপনি পুরনো স্কেলের প্রারম্ভিক ধাপে ছিলেন, তাই নতুন স্কেলের প্রারম্ভিক ধাপ <b>"+tk(r.fix)+"</b> এ বেতন নির্ধারিত হবে।"
               : "You were on the first step of the old scale, so you start on the first step of the new scale, <b>"+tk(r.fix)+"</b>.");
    }else{
      w.push(L ? "পুরনো মূল বেতন "+num(s.oldBasic)+" থেকে পুরনো স্কেলের প্রারম্ভিক ধাপ "+num(o0)+" বিয়োগ = <b>"+num(r.f.diff)+"</b>"
               : "Old basic pay "+num(s.oldBasic)+" minus the first step of the old scale "+num(o0)+" = <b>"+num(r.f.diff)+"</b>");
      w.push(L ? "নতুন স্কেলের প্রারম্ভিক ধাপ "+num(n0)+" + "+num(r.f.diff)+" = <b>"+num(r.f.sum)+"</b>"
               : "First step of the new scale "+num(n0)+" + "+num(r.f.diff)+" = <b>"+num(r.f.sum)+"</b>");
      w.push(r.f.exact
        ? (L ? num(r.f.sum)+" নতুন স্কেলের একটি ধাপ, তাই বেতন <b>"+tk(r.fix)+"</b> এ নির্ধারিত।" : num(r.f.sum)+" is a step on the new scale, so your pay is fixed at <b>"+tk(r.fix)+"</b>.")
        : (L ? num(r.f.sum)+" কোনও ধাপ নয়, তাই পরবর্তী উচ্চতর ধাপ <b>"+tk(r.fix)+"</b> এ বেতন নির্ধারিত।" : num(r.f.sum)+" is not a step, so your pay moves up to the next step, <b>"+tk(r.fix)+"</b>."));
    }
    if(s.inc){
      w.push(r.N>r.fix
        ? (L ? "১ জুলাই ২০২৬ এর বার্ষিক বেতনবৃদ্ধি যোগ করে <b>"+tk(r.N)+"</b>।" : "Add the annual increment of 1 July 2026 to reach <b>"+tk(r.N)+"</b>.")
        : (L ? "আপনি স্কেলের শেষ ধাপে আছেন, তাই আর বেতনবৃদ্ধি নেই।" : "You are on the last step of the scale, so there is no further increment."));
    }
  }
  w.push(L ? "নির্ধারিত বেতন "+num(r.fix)+" থেকে পুরনো মূল বেতন "+num(s.oldBasic)+" বিয়োগ = <b>"+num(r.gap)+"</b>। শুধু এই অংশ ধাপে ধাপে: ডিসেম্বর ২০২৬ পর্যন্ত "+num(r.p[0]*100)+"%, জুন ২০২৭ পর্যন্ত "+num(r.p[1]*100)+"%, ১ জুলাই ২০২৭ থেকে ১০০%।"
           : "Fixed pay "+num(r.fix)+" minus old basic pay "+num(s.oldBasic)+" = <b>"+num(r.gap)+"</b>. Only this gap is staged: "+num(r.p[0]*100)+"% until December 2026, "+num(r.p[1]*100)+"% until June 2027, and 100% from 1 July 2027.");
  if(r.inc>0) w.push(L ? "বার্ষিক বেতনবৃদ্ধি "+num(r.inc)+" পুরোটাই যোগ হয়, শতাংশ ছাড়া এবং একবারই: জুলাই থেকে ডিসেম্বর ২০২৬ এ "+num(s.oldBasic)+" + "+num(r.p[0]*r.gap)+" + "+num(r.inc)+" = <b>"+tk(r.b1)+"</b>।"
           : "The increment of "+num(r.inc)+" is added in full, with no percentage and only once: July to December 2026 is "+num(s.oldBasic)+" + "+num(r.p[0]*r.gap)+" + "+num(r.inc)+" = <b>"+tk(r.b1)+"</b>.");
  $("work").innerHTML=w.map(function(x){return "<li>"+x+"</li>";}).join("");
  $("result").innerHTML=
    '<div class="hl"><span class="s">'+esc(T("res_new"))+'</span><span class="big">'+tk(r.N)+'</span></div>'+
    '<div><span class="s">'+esc(T("res_raise"))+'</span><span class="big">'+signed(r.D)+'</span></div>'+
    '<div><span class="s">'+esc(T("res_27"))+'</span><span class="big">'+tk(r.N27)+'</span></div>';

  /* staircase */
  $("stairBlock").hidden=r.fixedPost;
  if(!r.fixedPost){
    var n=NEW[g], lo=n[0], hi=n[n.length-1], bars="";
    n.forEach(function(v,i){
      var h=22+78*(v-lo)/(hi-lo), cls="";
      if(i===r.f.idx) cls="fix";
      if(i===r.idxN) cls="now";
      if(i===r.idx27 && r.idx27!==r.idxN) cls="next";
      bars+='<i class="'+cls+'" style="height:'+h.toFixed(1)+'%" title="'+esc(T("step"))+' '+num(i+1)+': '+tk(v)+'"></i>';
    });
    $("stairs").innerHTML=bars; $("stairs").setAttribute("aria-label",T("stairs_aria"));
    $("endLo").textContent=tk(lo); $("endHi").textContent=tk(hi);
    var lg="";
    if(r.f.idx!==r.idxN) lg+='<li><em style="background:var(--green-mid)"></em><span>'+esc(T("lg_fix"))+'</span><b>'+tk(r.fix)+'</b></li>';
    lg+='<li><em style="background:var(--green)"></em><span>'+esc(r.f.idx!==r.idxN?T("lg_now"):T("lg_fix"))+'</span><b>'+tk(r.N)+'</b></li>';
    if(r.idx27!==r.idxN) lg+='<li><em style="background:var(--red)"></em><span>'+esc(T("lg_next"))+'</span><b>'+tk(r.N27)+'</b></li>';
    $("legend").innerHTML=lg;
  }

  /* ledger */
  var heads=[[T("c0"),T("c0s")],[T("c1"),num(r.p[0]*100)+"% "+T("of_raise")],[T("c2"),num(r.p[1]*100)+"% "+T("of_raise")],[T("c3"),T("c3s")],[T("c4"),T("c4s")]];
  if(L){ heads[1][1]=T("of_raise")+" "+num(r.p[0]*100)+"% + বেতনবৃদ্ধি"; heads[2][1]=T("of_raise")+" "+num(r.p[1]*100)+"% + বেতনবৃদ্ধি"; }
  var t='<colgroup><col><col><col><col><col><col class="final"></colgroup><thead><tr><th></th>';
  heads.forEach(function(h){ t+='<th scope="col">'+esc(h[0])+'<small>'+esc(h[1])+'</small></th>'; });
  t+='</tr></thead><tbody>';
  function row(label,key,cls){
    var x='<tr'+(cls?' class="'+cls+'"':'')+'><td>'+esc(label)+'</td>';
    r.cols.forEach(function(c,i){
      var v=c[key], txt = key==="delta" ? (i===0?"":signed(v)) : (key==="gpf"||key==="bf"||key==="stamp"||key==="loan"||key==="home"||key==="tax") ? "− "+tk(v) : (key==="sp"&&i>0 ? (L?"বিলুপ্ত":"ended") : tk(v));
      x+='<td'+(key==="delta"&&v<0?' class="neg"':'')+'>'+txt+'</td>';
    });
    return x+'</tr>';
  }
  t+=row(T("r_basic"),"basic")+row(T("r_hr"),"hr")+row(T("r_med"),"med")+row(T("r_oth"),"oth");
  if(s.special>0) t+=row(T("r_sp"),"sp");
  var gl=T("r_gpf")+" ("+num(s.gpf)+"%)";
  var bl=T("r_bf")+" ("+num(s.bfRate)+"%"+(s.bfCap>0?", "+T("max")+" "+num(s.bfCap):"")+")";
  var anyDed = s.gpf>0 || (s.bf&&s.bfRate>0) || s.stamp || s.loan>0 || s.homeLoan || s.tax>0;
  $("bfRow").hidden=!s.bf;
  t+=row(T("r_total"),"total","total")+(s.gpf>0?row(gl,"gpf","ded"):"")+(s.bf&&s.bfRate>0?row(bl,"bf","ded"):"")+(s.stamp?row(T("r_stamp"),"stamp","ded"):"")+(s.tax>0?row(T("r_tax"),"tax","ded"):"")+(s.homeLoan?row(T("r_home"),"home","ded"):"")+(s.loan>0?row(T("r_loan"),"loan","ded"):"")+(anyDed?row(T("r_net"),"net","total"):"")+row(T("r_delta"),"delta","delta")+'</tbody>';
  $("ledger").innerHTML=t;
  var pc="";
  r.cols.forEach(function(c,i){
    pc+='<div class="period"><h3><span>'+esc(heads[i][0])+'</span><small>'+esc(heads[i][1])+'</small></h3><div class="kv">'+
      '<div><span>'+esc(T("r_basic"))+'</span><b>'+tk(c.basic)+'</b></div>'+
      '<div><span>'+esc(T("r_hr"))+'</span><b>'+tk(c.hr)+'</b></div>'+
      '<div><span>'+esc(T("r_med"))+'</span><b>'+tk(c.med)+'</b></div>'+
      '<div><span>'+esc(T("r_oth"))+'</span><b>'+tk(c.oth)+'</b></div>'+
      (s.special>0&&i===0?'<div><span>'+esc(T("r_sp"))+'</span><b>'+tk(c.sp)+'</b></div>':'')+
      '<div class="tot"><span>'+esc(T("r_total"))+'</span><b>'+tk(c.total)+'</b></div>'+
      (s.gpf>0?'<div class="ded"><span>'+esc(gl)+'</span><b>− '+tk(c.gpf)+'</b></div>':'')+
      (s.bf&&s.bfRate>0?'<div class="ded"><span>'+esc(bl)+'</span><b>− '+tk(c.bf)+'</b></div>':'')+
      (s.stamp?'<div class="ded"><span>'+esc(T("r_stamp"))+'</span><b>− '+tk(c.stamp)+'</b></div>':'')+
      (s.tax>0?'<div class="ded"><span>'+esc(T("r_tax"))+'</span><b>− '+tk(c.tax)+'</b></div>':'')+
      (s.homeLoan?'<div class="ded"><span>'+esc(T("r_home"))+'</span><b>− '+tk(c.home)+'</b></div>':'')+
      (s.loan>0?'<div class="ded"><span>'+esc(T("r_loan"))+'</span><b>− '+tk(c.loan)+'</b></div>':'')+
      (anyDed?'<div class="tot"><span>'+esc(T("r_net"))+'</span><b>'+tk(c.net)+'</b></div>':'')+
      (i>0?'<div class="dl"><span>'+esc(T("r_delta"))+'</span><b'+(c.delta<0?' style="color:var(--red)"':'')+'>'+signed(c.delta)+'</b></div>':'')+
      '</div></div>';
  });
  $("periods").innerHTML=pc;

  var it='<li><span>'+esc(T("r_hr"))+(r.hrPct?' ('+(L?esc(T("hr_pct"))+' '+num(r.hrPct)+'%':num(r.hrPct)+'% '+esc(T("hr_pct")))+')':'')+'</span><b>'+tk(r.newHR)+'</b></li>'+
         '<li><span>'+esc(T("r_med"))+'</span><b>'+tk(r.newMed)+'</b></li>';
  r.items.forEach(function(x){ it+='<li><span>'+esc(T(x[0]))+'</span><b>'+tk(x[1])+'</b></li>'; });
  $("items").innerHTML=it;

  /* arrears and yearly */
  var a='<div><span>'+esc(T("ar_month"))+'</span><b>'+tk(r.arrExtra)+'</b></div>';
  if(s.specialPaid>0) a+='<div><span>'+esc(T("ar_sp"))+'</span><b>− '+tk(s.specialPaid)+'</b></div>';
  if(r.arrHR<0) a+='<div><span>'+esc(T("ar_hrx"))+'</span><b>− '+tk(-r.arrHR)+'</b></div>';
  if(r.arrHR>0) a+='<div><span>'+esc(T("ar_hrs"))+'</span><b>+ '+tk(r.arrHR)+'</b></div>';
  if(r.arrGpf>0) a+='<div><span>'+esc(T("ar_gpf"))+' ('+num(s.gpf)+'%)</span><b>− '+tk(r.arrGpf)+'</b></div>';
  if(r.arrBf>0) a+='<div><span>'+esc(T("ar_bf"))+'</span><b>− '+tk(r.arrBf)+'</b></div>';
  if(s.special>0||r.arrHR!==0||r.arrGpf>0||r.arrBf>0) a+='<div><span>'+esc(T("ar_net"))+'</span><b>'+tk(r.arrearMonth)+'</b></div>';
  a+='<div><span>'+esc(T("ar_two"))+'</span><b>'+tk(r.arrearMonth*3)+'</b></div>';
  $("arrear").innerHTML=a;
  $("yearly").innerHTML='<div><span>'+esc(T("y_fest"))+'</span><b>'+tk(r.N27*2)+'</b></div><div><span>'+esc(T("y_nab"))+'</span><b>'+tk(Math.round(r.N27*0.15))+'</b></div>';
}

function currentTheme(){
  var t=document.documentElement.getAttribute("data-theme");
  if(t==="light"||t==="dark") return t;
  return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
}
function markTheme(){
  var dark=currentTheme()==="dark", b=$("themeBtn");
  b.classList.toggle("is-dark",dark);
  var label=T(dark?"th_light":"th_dark");
  b.setAttribute("aria-label",label); b.setAttribute("title",label);
}
function setTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  try{localStorage.setItem("ps26theme",t);}catch(e){}
  markTheme();
}
try{ var st=localStorage.getItem("ps26theme"); if(st==="light"||st==="dark") document.documentElement.setAttribute("data-theme",st); }catch(e){}
/* Direct PDF download. html2pdf draws the results through the browser's own
   text engine onto a canvas, so the Bengali stays shaped exactly as on
   screen. The library (about 900 KB) is fetched only when the button is used.
   If it cannot load, the browser's print dialog is the fallback. */
var PDFLIB="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js";
function loadPdfLib(){
  return new Promise(function(ok,fail){
    if(window.html2pdf) return ok();
    var sc=document.createElement("script"); sc.src=PDFLIB; sc.onload=ok; sc.onerror=fail;
    document.head.appendChild(sc);
  });
}
function buildPdfDoc(){
  var doc=document.createElement("div"); doc.className="pdfdoc"; doc.lang=document.documentElement.lang;
  var head=document.createElement("div"); head.className="pdfhead";
  head.appendChild(document.querySelector(".mast h1").cloneNode(true));
  head.appendChild(document.querySelector(".mast p").cloneNode(true));
  doc.appendChild(head);
  var out=document.querySelector("section.out").cloneNode(true);
  out.removeAttribute("aria-live");
  Array.prototype.forEach.call(out.querySelectorAll(".check,.linkbtn,.periods,.notes,.pdfbar,[id]"),function(n){
    if(n.id && !n.matches(".check,.linkbtn,.periods,.notes,.pdfbar")) n.removeAttribute("id"); else n.remove();
  });
  doc.appendChild(out);
  return doc;
}
$("pdfBtn").addEventListener("click",function(){
  var btn=this, st=readState(), name="Pay Scale 2026 - Grade "+st.grade+" - "+st.oldBasic+".pdf";
  if(btn.disabled) return;
  btn.disabled=true; $("pdfLabel").textContent=T("pdf_wait");
  function done(){ btn.disabled=false; $("pdfLabel").textContent=T("pdf"); }
  loadPdfLib().then(function(){
    return window.html2pdf().set({
      margin:[10,10,10,10], filename:name,
      image:{type:"jpeg",quality:0.95},
      html2canvas:{scale:2,backgroundColor:"#ffffff",scrollX:0,scrollY:0,logging:false},
      jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},
      pagebreak:{mode:["css"],avoid:[".block",".printsum","tr"]}
    }).from(buildPdfDoc()).save();
  }).then(done,function(){
    done();
    var prev=document.title; document.title=name.replace(/\.pdf$/,"");
    function restore(){ document.title=prev; window.removeEventListener("afterprint",restore); }
    window.addEventListener("afterprint",restore);
    window.print();
  });
});
$("themeBtn").addEventListener("click",function(){ setTheme(currentTheme()==="dark"?"light":"dark"); });
if(window.matchMedia){ try{ window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",markTheme); }catch(e){} }
markTheme();
function setLang(l){
  lang=l; try{localStorage.setItem("ps26lang",l);}catch(e){}
  applyText(); markTheme(); buildGrades(); buildSteps(); render();
}
Array.prototype.forEach.call(document.querySelectorAll(".lang button"),function(b){ b.addEventListener("click",function(){ setLang(b.getAttribute("data-lang")); }); });
["oHR","oMed","oOth"].forEach(function(id){ $(id).addEventListener("input",function(){ autoOld[id]=false; render(); }); });
$("resetOld").addEventListener("click",function(){ autoOld={oHR:true,oMed:true,oOth:true}; render(); });
$("grade").addEventListener("change",function(){ buildSteps(); render(); });
$("arrDed").addEventListener("change",render);
$("gpfRange").addEventListener("input",function(){ $("gpf").value=$("gpfRange").value; render(); });
$("gpf").addEventListener("input",function(){ var v=parseFloat($("gpf").value)||0; $("gpfRange").value=Math.min(25,Math.max(0,v)); render(); });
$("special").addEventListener("change",function(){ autoSp=false; render(); });
["tax","homeLoan","loan","bf","bfRate","bfCap","stamp","basic","basicFixed","inc","loc","quarter","age","kids","tiffin","conv","mobile","wash","charge","hill","haor","train","dis","ent"].forEach(function(id){
  $(id).addEventListener(($(id).type==="number")?"input":"change",render);
});
setLang(lang);
</script>
